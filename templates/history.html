{% extends "base.html" %}

{% block content %}
<section class="history-page">
    <div class="container">
        <h1 class="page-title">Riwayat Analisis</h1>
        <p class="page-subtitle">Lihat kembali hasil scan kulit sebelumnya</p>

        <div id="historyList" class="history-list">
            <div class="loading-spinner">Memuat riwayat...</div>
        </div>

        <div id="emptyState" class="empty-state" style="display:none;">
            <div class="empty-icon">📷</div>
            <h3>Belum Ada Riwayat</h3>
            <p>Mulai scan kulit pertama Anda sekarang!</p>
            <a href="/camera" class="btn btn-primary">📷 Mulai Scan</a>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/history.js') }}"></script>
{% endblock %}
